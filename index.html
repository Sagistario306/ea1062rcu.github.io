<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA1062RCU - Galería de Premios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EA1062RCU</h1>
        <p>Premios, Diplomas y Actividades de Radioafición</p>
    </header>

    <main class="container">
        <!-- SECCIÓN: RINCÓN DEL RADIOAFICIONADO -->
        <section class="section-awards">
            <h2>🎙️ Rincón del Radioaficionado</h2>
            <div class="award-grid">
                <div class="award-card">
                    <img src="imagenes/rincon1.jpg" alt="Premio Rincón 1" loading="lazy">
                    <div class="award-info">Diploma Rincón #1</div>
                </div>
                <div class="award-card">
                    <img src="imagenes/rincon2.jpg" alt="Premio Rincón 2" loading="lazy">
                    <div class="award-info">Diploma Rincón #2</div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN: WWBOTA -->
        <section class="section-awards">
            <h2>⛰️ WWBOTA</h2>
            <div class="award-grid">
                <div class="award-card">
                    <img src="imagenes/wwbota1.jpg" alt="Premio BOTA 1" loading="lazy">
                    <div class="award-info">Activación BOTA #1</div>
                </div>
                <div class="award-card">
                    <img src="imagenes/wwbota2.jpg" alt="Premio BOTA 2" loading="lazy">
                    <div class="award-info">Activación BOTA #2</div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN: APRS -->
        <section class="section-awards">
            <h2>🛰️ APRS</h2>
            <div class="award-grid">
                <div class="award-card">
                    <img src="imagenes/aprs1.jpg" alt="Premio APRS 1" loading="lazy">
                    <div class="award-info">Logro APRS</div>
                </div>
                <div class="award-card">
                    <img src="imagenes/aprs2.jpg" alt="Premio APRS 2" loading="lazy">
                    <div class="award-info">Certificado APRS</div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN: OTROS PREMIOS -->
        <section class="section-awards">
            <h2>🏆 Otros Premios</h2>
            <div class="award-grid">
                <div class="award-card">
                    <img src="imagenes/otro1.jpg" alt="Otro Premio 1" loading="lazy">
                    <div class="award-info">Premio Especial</div>
                </div>
                <div class="award-card">
                    <img src="imagenes/otro2.jpg" alt="Otro Premio 2" loading="lazy">
                    <div class="award-info">Reconocimiento</div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
